[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vetls"
dynamic = ["version"]
description = "Non-invasive TLS configuration, X.509 certificate, chain trust and SSH-banner security audit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["tls", "ssl", "security", "audit", "x509", "certificate", "scanner", "ssh", "sarif"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]
# not_valid_before_utc / not_valid_after_utc need cryptography 42+
dependencies = ["cryptography>=42", "idna>=3"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "mypy>=1.8", "build>=1"]

[project.scripts]
vetls = "vetls.cli:main"

[project.urls]
Homepage = "https://github.com/versex-arch/vetls"
Issues = "https://github.com/versex-arch/vetls/issues"
Changelog = "https://github.com/versex-arch/vetls/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "vetls.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vetls = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
filterwarnings = ["error::DeprecationWarning:vetls"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/vetls/suffixes.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/vetls"]
